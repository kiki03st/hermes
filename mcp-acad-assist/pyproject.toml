[project]
name = "acad-assist"
version = "0.1.0"
description = "AutoCAD 조회·수정·캡처·내보내기·승인 게이트 MCP (CAD-MCP가 못 하는 것만 채움)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acad-assist = "acad_assist.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acad_assist"]
